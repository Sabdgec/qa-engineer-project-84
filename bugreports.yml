- summary: |
    Съезжает количество товаров в корзине при добавлении нескольких товаров (испанский интерфейс)
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
    Язык интерфейса: Испанский
  steps-to-reproduce: |
    1. Перейти на главную страницу интернет-магазина
    2. Переключить язык интерфейса на испанский
    3. Добавить три товара в корзину
    4. Открыть корзину
  expected-result: |
    Количество товаров отображается корректно и выровнено в соответствии с дизайном
  actual-result: |
    Количество товаров съезжает влево, выходит за пределы заданного расположения
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/blob/main/artifacts/kovbo_v_korzine.png
