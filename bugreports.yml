---
- summary: |
    Корзина не очищается после оформления заказа
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Оформить заказ
    3. Проверить содержимое корзины
  expected-result: |
    После оформления заказа корзина очищается
  actual-result: |
    Корзина остаётся заполненной
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/blob/main/artifacts/Запись%20экрана%202025-10-06%20в%2023.49.59.mov

- summary: |
    После перехода на следующую страницу пользователь остаётся внизу
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Открыть список товаров
    2. Пролистать страницу до конца
    3. Нажать кнопку перехода на следующую страницу
  expected-result: |
    Пользователь автоматически перемещается в начало списка товаров
  actual-result: |
    Пользователь остаётся внизу страницы, приходится вручную прокручивать вверх
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/blob/main/artifacts/Запись%20экрана%202025-10-06%20в%2023.49.35.mov

- summary: |
    Кнопка "В корзину" имеет разный стиль отображения у разных товаров
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Обратить внимание на кнопки "В корзину" под каждым товаром
  expected-result: |
    Все кнопки "В корзину" должны иметь единый стиль: одинаковый размер, цвет, шрифт и отступы
  actual-result: |
    Кнопки имеют разный стиль, размеры и отступы; на мобильной версии верстка ломается
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/tree/main/artifacts/knopki_v_karzin

- summary: |
    Фильтр по цене работает только на текущей странице
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Установить фильтр по цене (например, от 5$ до 20$)
    2. Просмотреть все страницы каталога
  expected-result: |
    Все товары в каталоге, соответствующие цене, отображаются
  actual-result: |
    Фильтр применяется только на текущей странице, на других страницах товары остаются без фильтра
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/blob/main/artifacts/filtr_po_cene.mov

- summary: |
    Фильтр по производителю ломается при смене страниц
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Установить фильтр по производителю (например, Dior)
    2. Перейти на следующую страницу каталога
    3. Проверить отображение товаров
  expected-result: |
    Отображаются только товары выбранного производителя на всех страницах
  actual-result: |
    Некоторые товары исчезают, элементы пропадают, верстка ломается
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/blob/main/artifacts/filtr_po_proizvod_lomaet.mov

- summary: |
    Фильтр по наличию не работает при снятии галочки
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Включить фильтр "В наличии"
    2. Снять галочку
  expected-result: |
    Отображаются все товары каталога
  actual-result: |
    После снятия галочки все товары исчезают
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/blob/main/artifacts/filtr_po_nalich_lom.mov

- summary: |
    Перевод интерфейса на русский и испанский работает частично
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Переключить язык интерфейса на русский или испанский
  expected-result: |
    Все элементы интерфейса переведены на выбранный язык
  actual-result: |
    Переводится только верхнее меню, кнопки "В корзину" и фильтр "от-до"; остальной интерфейс остаётся на английском
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/tree/main/artifacts/perevod_chast
    
- summary: |
    Искажение верстки на мобильных устройствах
  environment: |
    Устройства: iPhone 15 Pro Max
    ОС: iOS 26.2
    Браузеры: Safari
  steps-to-reproduce: |
    1. Открыть каталог товаров на мобильном устройстве
  expected-result: |
    Все элементы интерфейса выровнены, карточки товаров корректно отображаются
  actual-result: |
    Карточки товаров смещаются, элементы накладываются друг на друга, верстка ломается
  attachments:
    - https://github.com/Sabdgec/qa-engineer-project-84/tree/main/artifacts/iskazh_verstki
    
