  - summary: |
      Отсутствие бокового меню на мобильной версии
    status: fail
    note: "На мобильной версии отображается только верхнее меню, боковое отсутствует"

  - summary: |
      Сброс фильтров на мобильной версии при смене языка и переходе в корзину
    status: fail
    note: "После смены языка и возврата из корзины все фильтры сбрасываются"

bugreports:
- summary: |
    Сброс фильтров при продолжении покупок из корзины
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Применить фильтры на каталоге
    2. Добавить товар в корзину
    3. Нажать "Продолжить покупки"
  expected-result: |
    Фильтры остаются активными, товары показываются согласно выбранным фильтрам
  actual-result: |
    Все фильтры сбрасываются, каталог отображает все товары

- summary: |
    Поиск по ключевому слову оставляет только первую страницу при несуществующих товарах
  environment: |
    Устройства: MacBook Pro, iPhone 15 Pro Max
    ОС: macOS 26.2, iOS 26.2
    Браузеры: Safari, Chrome
  steps-to-reproduce: |
    1. Ввести несуществующий товар в строку поиска
  expected-result: |
    Отображается сообщение "Товар не найден" или пустой результат без искажений страниц
  actual-result: |
    Поиск оставляет только первую страницу каталога

- summary: |
    Отсутствие бокового меню на мобильной версии
  environment: |
    Устройства: iPhone 15 Pro Max
    ОС: iOS 26.2
    Браузеры: Safari
  steps-to-reproduce: |
    1. Открыть мобильную версию сайта
  expected-result: |
    На мобильной версии отображается боковое меню для навигации
  actual-result: |
    Отображается только верхнее меню, боковое отсутствует

- summary: |
    Сброс фильтров на мобильной версии при смене языка и переходе в корзину
  environment: |
    Устройства: iPhone 15 Pro Max
    ОС: iOS 26.2
    Браузеры: Safari
  steps-to-reproduce: |
    1. Включить фильтры на мобильной версии
    2. Переключить язык интерфейса
    3. Перейти в корзину, затем вернуться в каталог
  expected-result: |
    Выбранные фильтры сохраняются
  actual-result: |
    Все фильтры сбрасываются
