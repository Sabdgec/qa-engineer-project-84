---
- summary: |
    Поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Поисковый запрос = Lipstick
  steps:
    - Ввести "Lipstick" в строку поиска
  expected-result: |
    На странице отображаются только товары с названием или описанием, содержащим "Lipstick"

- summary: |
    Фильтрация товаров по цене
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по цене
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Цена от = 5, Цена до = 20
  steps:
    - Ввести 5 в поле "От"
    - Ввести 20 в поле "До"
  expected-result: |
    Отображаются только товары с ценой от 5$ до 20$

- summary: |
    Фильтрация товаров по производителю
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по производителю
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Производитель = Dior
  steps:
    - Установить галочку "Dior" в фильтре производителей
  expected-result: |
    Отображаются только товары бренда "Dior"

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категории
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Категория = beauty
  steps:
    - Выбрать категорию "beauty"
  expected-result: |
    В каталоге отображаются только товары выбранной категории

- summary: |
    Фильтрация товаров по наличию
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по наличию
  prerequisites: |
    Открыта главная страница магазина
  test-data: empty
  steps:
    - Включить фильтр "В наличии"
  expected-result: |
    Отображаются только товары, доступные для покупки

- summary: |
    Отображение информации о товарах в каталоге
  requirement: |
    В каталоге должны отображаться название, рейтинг, цена со скидкой и без
  prerequisites: |
    Открыта главная страница магазина
  test-data: empty
  steps:
    - Просмотреть любой товар в каталоге
  expected-result: |
    У товара отображаются название, рейтинг, старая цена и цена со скидкой

- summary: |
    Добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Товар = Red Lipstick
  steps:
    - Найти товар "Red Lipstick"
    - Нажать кнопку "В корзину"
    - Открыть корзину
  expected-result: |
    В корзине отображается товар "Red Lipstick" с количеством = 1

- summary: |
    Добавление нескольких одинаковых товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять несколько одинаковых товаров
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Товар = Essence Mascara Lash Princess
  steps:
    - Дважды нажать "Add to cart" у одного товара
    - Открыть корзину
  expected-result: |
    В корзине отображается выбранный товар с количеством 2

- summary: |
    Добавление разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять разные товары
  prerequisites: |
    Открыта главная страница магазина
  test-data: empty
  steps:
    - Добавить два разных товара в корзину
    - Открыть корзину
  expected-result: |
    В корзине отображаются оба товара

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалять товары из корзины
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: |
    Товар = Red Lipstick
  steps:
    - Открыть корзину
    - Нажать "Удалить" у товара "Red Lipstick"
  expected-result: |
    Товар исчезает из корзины, корзина пуста

- summary: |
    Очистка корзины
  requirement: |
    Пользователь должен иметь возможность очистить корзину
  prerequisites: |
    В корзине есть товары
  test-data: empty
  steps:
    - Нажать кнопку "Clear cart"
  expected-result: |
    Корзина становится пустой

- summary: |
    Переход к странице оплаты после оформления заказа
  requirement: |
    На странице корзины пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзине есть хотя бы один товар
  test-data: empty
  steps:
    - Открыть корзину
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Пользователь перенаправляется на страницу оплаты

- summary: |
    Навигация по страницам каталога
  requirement: |
    Пользователь должен иметь возможность просматривать товары постранично
  prerequisites: |
    Открыта главная страница магазина
  test-data: empty
  steps:
    - Нажать кнопку "Next"
  expected-result: |
    Открывается следующая страница каталога

- summary: |
    Просмотр страницы товара
  requirement: |
    Пользователь должен иметь возможность просматривать страницу товара
  prerequisites: |
    Открыта главная страница магазина
  test-data: empty
  steps:
    - Кликнуть на карточку товара
  expected-result: |
    Открывается страница товара с подробной информацией

- summary: |
    Переход по хэштегу категории со страницы товара
  requirement: |
    Пользователь должен иметь возможность перейти в категорию через хэштег
  prerequisites: |
    Открыта страница товара
  test-data: empty
  steps:
    - Нажать на хэштег категории
  expected-result: |
    Пользователь перенаправляется в соответствующую категорию каталога

- summary: |
    Поиск несуществующего товара
  requirement: |
    Пользователь должен получать корректный ответ при отсутствии товаров
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Поисковый запрос = qwerty123
  steps:
    - Ввести "qwerty123" в строку поиска
  expected-result: |
    Отображается сообщение, что товары не найдены

- summary: |
    Смена языка интерфейса
  requirement: |
    Пользователь должен иметь возможность сменить язык
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Язык = Русский
  steps:
    - Выбрать язык "Русский"
  expected-result: |
    Интерфейс сайта отображается на русском языке

- summary: |
    Проверка работы сайта на мобильных устройствах
  requirement: |
    Сайт должен корректно отображаться на мобильных устройствах
  prerequisites: |
    Сайт открыт на мобильном устройстве
  test-data: empty
  steps:
    - Открыть каталог товаров
  expected-result: |
    Элементы страницы отображаются корректно, карточки не накладываются друг на друга

- summary: |
    Проверка сетевых запросов через DevTools
  requirement: |
    Сайт должен корректно отправлять и получать сетевые запросы
  prerequisites: |
    Открыт DevTools
  test-data: empty
  steps:
    - Открыть вкладку Network
    - Обновить страницу
  expected-result: |
    Все запросы возвращают статус 200

- summary: |
    Проверка корректного отображения кнопок "В корзину"
  requirement: |
    Кнопки "В корзину" должны быть одинакового размера и находиться внутри карточек товаров
  prerequisites: |
    Открыта главная страница магазина
  test-data: empty
  steps:
    - Просмотреть несколько карточек товаров
  expected-result: |
    Кнопки одинакового размера, не выходят за границы карточки

- summary: |
    Проверка корректного отображения интерфейса при смене языка (Safari, MacBook)
  requirement: |
    Все элементы интерфейса должны корректно отображаться и переводиться при смене языка
  prerequisites: |
    Устройство: MacBook, Браузер: Safari
  test-data: |
    Язык = Русский / Spanish
  steps:
    - Сменить язык на Русский или Español
    - Проверить меню, фильтры, карточки товаров
  expected-result: |
    Все элементы переведены корректно, структура страницы сохранена
