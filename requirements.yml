---
functional:
  - Пользователь должен иметь возможность просматривать каталог товаров
  - Пользователь должен иметь возможность просматривать карточку товара
  - В каталоге и на странице товара должны отображаться название, рейтинг, цена без скидки и цена со скидкой
  - Пользователь должен иметь возможность искать товары по ключевому слову
  - Пользователь должен иметь возможность фильтровать товары по цене
  - Пользователь должен иметь возможность фильтровать товары по производителю
  - Пользователь должен иметь возможность фильтровать товары по категории
  - Пользователь должен иметь возможность фильтровать товары по наличию
  - Пользователь должен иметь возможность переходить между страницами каталога
  - Пользователь должен иметь возможность добавлять товары в корзину
  - Пользователь должен иметь возможность добавлять в корзину несколько одинаковых товаров
  - Пользователь должен иметь возможность добавлять в корзину разные товары
  - Пользователь должен иметь возможность просматривать содержимое корзины
  - Пользователь должен иметь возможность удалять товары из корзины
  - Пользователь должен иметь возможность очистить корзину полностью
  - Пользователь должен иметь возможность продолжить выбор товаров после добавления в корзину
  - Пользователь должен иметь возможность оформить заказ
  - После оформления заказа пользователь должен быть перенаправлен на страницу оплаты
  - Корзина должна сохраняться в рамках сессии браузера
  - Пользователь должен иметь возможность переключать язык интерфейса
  - Сайт должен поддерживать русский и английский языки

non-functional:
  - Сайт должен быть SPA-приложением без перезагрузки страницы
  - Сайт должен корректно отображаться на мобильных устройствах
  - Сайт должен быть адаптирован для экранов различных размеров
  - Сайт должен быть совместим с последними версиями популярных браузеров
  - Сайт должен обеспечивать быструю загрузку страниц
  - Сайт должен быть устойчив к высоким нагрузкам
  - Сайт должен обеспечивать безопасность пользовательских данных
  - Сайт должен быть доступен без использования VPN

implicit:
  - Интерфейс сайта должен быть интуитивно понятным
  - Элементы управления должны иметь единый визуальный стиль
  - Все интерактивные элементы должны корректно реагировать на действия пользователя
  - Ошибки пользовательского ввода должны обрабатываться корректно
  - Все данные, получаемые от сервера, должны отображаться без искажений
  - Все фильтры должны работать по всему каталогу товаров
  - Сайт должен корректно работать при медленном интернет-соединении

